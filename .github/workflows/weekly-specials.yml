# Free Friday newsletter job (replaces Celery Beat send_weekly_specials).

name: Weekly specials email

on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Send weekly specials
        env:
          APP_ENV: production
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://dineadeal.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: python -c "from app.workers.tasks import send_weekly_specials; print(send_weekly_specials())"
        working-directory: backend
