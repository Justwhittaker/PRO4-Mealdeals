# Dine A Deal API — Render Blueprint
# Dashboard: https://dashboard.render.com
#
# Free stack: web + postgres + redis. Scheduled scrapes run via GitHub Actions
# (.github/workflows/scrape-zones.yml) — no paid Celery worker required.
# Optional: run Celery on a home NUC via backend/docker-compose.nuc.yml
services:
  - type: web
    name: dineadeal-api
    runtime: python
    plan: free
    region: frankfurt
    branch: master
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dineadeal.com,https://www.dineadeal.com,http://localhost:3000,http://127.0.0.1:3000
      - key: FRONTEND_BASE_URL
        value: https://dineadeal.com
      - key: REVALIDATE_SECRET
        sync: false
      - key: DEEP_SCRAPE_ENABLED
        value: "true"
      - key: DEEP_SCRAPE_MAX_EXTRA_FETCHES
        value: "4"
      # Email: Render free blocks SMTP 25/465/587 — use Resend HTTPS instead.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Dine A Deal <onboarding@resend.dev>
      - key: CONTACT_TO_EMAIL
        value: just.whittaker@gmail.com
      - key: SMTP_ALLOW
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: dineadeal-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: dineadeal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dineadeal-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: dineadeal-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: dineadeal-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: dineadeal-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: dineadeal-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
