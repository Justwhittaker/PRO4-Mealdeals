# Free Friday newsletter job (replaces Celery Beat send_weekly_specials).

name: Weekly specials email

on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:
    inputs:
      test_email:
        description: >
          Subscriber email. When set, send only to that address and do not
          update last_emailed_at. Leave blank for the normal Friday send.
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Send weekly specials
        env:
          APP_ENV: production
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://dineadeal.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Empty on the Friday schedule. workflow_dispatch passes the input.
          WEEKLY_TEST_EMAIL: ${{ github.event.inputs.test_email || '' }}
        working-directory: backend
        run: |
          if [ -n "$WEEKLY_TEST_EMAIL" ]; then
            python scripts/send_weekly_specials.py --test-email "$WEEKLY_TEST_EMAIL"
          else
            python scripts/send_weekly_specials.py
          fi
