# Primary scrape engine — always-on NUC → Render cloud Postgres + Redis.
#
# Setup on the NUC:
#   cd ~/MealDeals/backend   # git pull PRO4-Mealdeals
#   cp .env.nuc.example .env
#   # Fill Render *External* DATABASE_URL_SYNC, Redis, REVALIDATE_SECRET
#   chmod +x scripts/nuc-up.sh scripts/nuc-celery-health.sh
#   ./scripts/nuc-up.sh
#
# Health alerts (optional): cp scripts/nuc-health.env.example scripts/nuc-health.env
#   crontab: */15 * * * * ~/MealDeals/backend/scripts/nuc-celery-health.sh
# Also set NTFY_TOPIC in backend/.env so Celery can push scrape-cycle digests.
#
# GitHub Actions runs weekly email only — scrape cron is disabled there.

services:
  celery-worker:
    build: .
    container_name: mealdeals-celery-nuc
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      FRONTEND_BASE_URL: https://dineadeal.com
      DEEP_SCRAPE_ENABLED: "true"
      DEEP_SCRAPE_MAX_EXTRA_FETCHES: "4"
      CELERY_WEEKLY_EMAIL_ENABLED: "false"
      # Six scrape processes. Override in backend/.env if needed (1–8).
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-6}
    restart: unless-stopped
    volumes:
      - celerybeat-data:/app/data
    # Start as root so the entrypoint can chown the Beat schedule volume, then
    # drop to appuser. Two workers: scrape (SCRAPE_CONCURRENCY, default 6)
    # and maintenance+beat (concurrency 1).
    user: "0:0"
    command: ["python", "/app/scripts/celery_nuc_supervisor.py"]

volumes:
  celerybeat-data:
